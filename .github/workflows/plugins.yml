name: Validate plugins

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install gpg for the PGP plugin tests
        run: sudo apt-get update && sudo apt-get install -y gnupg
      # actions/checkout only writes inside the workspace.
      - name: Checkout TideMail developer CLI
        uses: actions/checkout@v4
        with:
          repository: allisonhere/tidemail
          ref: main
          path: .tidemail-src
      - name: Build TideMail developer CLI
        run: |
          cd .tidemail-src
          CGO_ENABLED=0 go build -o /tmp/tidemail-bin .
      - name: Build and test plugins
        run: |
          for manifest in plugins/*/plugin.toml; do
            plugin_dir="${manifest%/plugin.toml}"
            plugin_id="$(basename "$plugin_dir")"
            (cd "$plugin_dir" && go test ./... && go build -buildvcs=false -o "tidemail-plugin-$plugin_id" .)
            /tmp/tidemail-bin plugin validate "$plugin_dir"
            /tmp/tidemail-bin plugin test "$plugin_dir"
          done
      - name: End-to-end PGP test in TideMail
        run: |
          cd .tidemail-src
          TIDEMAIL_PLUGINS_DIR="$GITHUB_WORKSPACE" go test -count=1 -run EndToEnd ./internal/pgpmail
      - name: Catalog generator builds
        run: cd scripts/catalog && go vet ./...
